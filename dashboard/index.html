<!doctype html>
<html lang="zh-CN" data-motion="full">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>GlimpseGate</title>
    <link rel="icon" href="/app/mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/app/styles.css">
    <script type="module" src="/app/main.js"></script>
  </head>
  <body>
    <canvas id="field" class="field" aria-hidden="true"></canvas>

    <div class="shell">
      <nav class="rail" aria-label="Primary">
        <a class="mark" href="#/gate" aria-label="GlimpseGate">
          <img src="/app/mark.svg" alt="" width="22" height="22">
        </a>
        <div class="rail-nav">
          <a href="#/gate" data-view="gate"><span class="rail-glyph" data-glyph="gate"></span><span data-t="nav.gate">Gate</span></a>
          <a href="#/library" data-view="library"><span class="rail-glyph" data-glyph="library"></span><span data-t="nav.library">Library</span></a>
          <a href="#/system" data-view="system"><span class="rail-glyph" data-glyph="system"></span><span data-t="nav.system">System</span></a>
        </div>
        <div class="rail-foot">
          <button type="button" class="lang" id="langToggle" aria-label="Language">中</button>
          <span class="health" id="health" title="server"></span>
        </div>
      </nav>

      <main class="stage" id="stage" tabindex="-1">
        <header class="strip">
          <span class="strip-brand">GLIMPSEGATE</span>
          <span class="strip-sep">/</span>
          <span class="strip-view" id="stripView">gate</span>
          <span class="strip-fill"></span>
          <span class="strip-meta" id="stripMeta">—</span>
          <button type="button" class="kbd-hint" id="paletteHint"><kbd>⌘</kbd><kbd>K</kbd></button>
        </header>
        <div id="view" class="view"></div>
      </main>
    </div>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <dialog id="palette" class="palette" aria-label="Command palette">
      <input id="paletteInput" type="text" autocomplete="off" spellcheck="false">
      <ul id="paletteList"></ul>
    </dialog>
    <noscript><p class="noscript">GlimpseGate needs JavaScript. The single-file offline checker is at <a href="/lite.html">/lite.html</a>.</p></noscript>
  </body>
</html>
